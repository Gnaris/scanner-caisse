# Version embarquée par défaut dans l'APK quand Gradle est invoqué SANS -P
# (ex. Android Studio ▶ Run, `./gradlew assembleDebug` à la main). Doit refléter
# la dernière release publiée pour que l'updater ne propose pas une MAJ qu'on
# vient d'installer. release-local.ps1 met ce fichier à jour automatiquement
# et le commit avant chaque release. En CI, versionName/versionCode viennent
# du tag poussé (`app-vX.Y.Z` → ces lignes sont écrasées par -P).
versionName=1.0.12
versionCode=10012
