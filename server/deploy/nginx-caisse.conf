# /etc/nginx/sites-available/caisse.beliandjolie.com
# Après création : ln -s vers sites-enabled, nginx -t, reload, puis
# certbot --nginx -d caisse.beliandjolie.com (ajoute le bloc 443 + redirection)
server {
    listen 80;
    listen [::]:80;
    server_name caisse.beliandjolie.com;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
